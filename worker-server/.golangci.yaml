version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - goprintffuncname
    - gosec
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
        rules:
          Main:
            files:
              - "$all"
            allow:
              - "$gostd"
              - "Zero_Devops"
              - "github.com/labstack/echo/v5"
              - "github.com/lib/pq"
              - "github.com/rabbitmq/amqp091-go"
              - "github.com/spf13/viper"
              - "github.com/golang-jwt/jwt/v5"
              - "golang.org/x/oauth2"
              - "golang.org/x/oauth2/github"
              - "go.uber.org/zap"
              - "github.com/google/uuid"
              - "github.com/aws/aws-sdk-go-v2/aws"
              - "github.com/aws/aws-sdk-go-v2/config"
              - "github.com/aws/aws-sdk-go-v2/credentials"
              - "github.com/aws/aws-sdk-go-v2/service/s3"
              - "github.com/moby/go-archive"
              - "github.com/moby/moby/client"
              - "github.com/santhosh-tekuri/jsonschema/v5"
              - "github.com/pelletier/go-toml/v2"
              - "github.com/Masterminds/semver/v3"
    dupl:
      threshold: 300
    funlen:
      lines: 200
      statements: 55
    goconst:
      min-len: 2
      min-occurrences: 3
      # These are protocol tokens / language identifiers repeated across independent policies.
      ignore-string-values:
        - '^(true|go|node|build|\.git|\.\.|astro|vitepress|laravel|dynamic/Dockerfile\.(node|go|rust)\.tmpl|pnpm-lock\.yaml|yarn\.lock|bun\.lockb|package-lock\.json|npm-shrinkwrap\.json|vite\.config\.js|svelte\.config\.js)$'
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - performance
        - style
        - opinionated
      disabled-checks:
        - unnamedResult
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - wrapperFunc
        # These joins intentionally build POSIX paths inside generated container instructions.
        - filepathJoin
        - hugeParam
    gocyclo:
      min-complexity: 20
    govet:
      enable:
        - shadow
    lll:
      line-length: 160
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
      ignored-functions:
        - strings.SplitN
    nolintlint:
      allow-unused: false
      require-explanation: false
      require-specific: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - mnd
          - dupl
          - goconst
          - gocyclo
          - gosec
          - lll
      - path: app
        text: "don't use `init` function"
      - path: internal/deployments/build_policy\.go
        text: "Function 'prepareBuildContext' has too many statements"
        linters:
          - funlen
      - path: internal/deployments/recipes\.go
        text: "Function 'renderRuntime' has too many statements"
        linters:
          - funlen
    paths: []
formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  go: "1.25"
