services:
  postgres:
    image: postgres:16-alpine
    container_name: zero_devops_worker-server-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - worker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zero_devops_worker
    # Required for Buildah's local Linux container/image namespaces.
    privileged: true
    security_opt:
      - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DATABASE_NAME: ${DATABASE_NAME}
      # Use host.docker.internal: localhost would be this worker container.
      RABBITMQ_CONNECTION_STRING: ${WORKER_RABBITMQ_CONNECTION_STRING:?set WORKER_RABBITMQ_CONNECTION_STRING in .env}
      SERVER_INTERNAL_URL: ${SERVER_INTERNAL_URL:?set SERVER_INTERNAL_URL in .env}
      WORKER_INTERNAL_AUTH_TOKEN: ${WORKER_INTERNAL_AUTH_TOKEN:?set WORKER_INTERNAL_AUTH_TOKEN in .env}
      CLOUDFLARE_BUCKET_NAME: ${CLOUDFLARE_BUCKET_NAME}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID}
      CLOUDFLARE_ACCESS_KEY_ID: ${CLOUDFLARE_ACCESS_KEY_ID}
      CLOUDFLARE_ACCESS_KEY_SECRET: ${CLOUDFLARE_ACCESS_KEY_SECRET}
      CLOUDFLARE_PUBLIC_BASE_URL: ${CLOUDFLARE_PUBLIC_BASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      MAX_RETRIES_COUNT: ${MAX_RETRIES_COUNT:-3}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - buildah_storage:/var/lib/containers
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zero_devops_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  worker_pgdata:
  buildah_storage:
